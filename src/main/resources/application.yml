#
# ?: <<APPLICATION CONFIGURATION>>
#
# * Layer:
# *  Application configuration and infrastructure integration.
#
# * Interface:
# *   Defines the configuration boundary between the application
# *   and its runtime environment.
#
# * Responsibility:
# *   Configure application behavior, infrastructure connections,
# *   observability, logging, monitoring, and external integrations.
#
# # Environment-specific values should be provided through
# #   environment variables whenever possible.
#

spring:
  application:
    name: bulk

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:todo}
    username: ${POSTGRES_USER:todo}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/todo}
      uuid-representation: standard
      auto-index-creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  structured:
    format:
      console: ecs

  level:
    dev.souto: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

    metrics:
      enabled: true

    prometheus:
      enabled: true

  health:
    livenessstate:
      enabled: true

    readinessstate:
      enabled: true

    group:
      liveness:
        include: livenessState

      readiness:
        include: readinessState,db,mongo

  metrics:
    tags:
      application: ${spring.application.name}

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  zipkin:
    tracing:
      endpoint: ${ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

springdoc:
  api-docs:
    path: /v3/api-docs

  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
