services:
  mongodb:
    image: 'mongo:7.0'
    ports:
      - '27017:27017'
    volumes:
      - ./src/main/resources/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./src/main/resources/mongo-seed.js:/docker-entrypoint-initdb.d/mongo-seed.js:ro
      - mongodb-data:/data/db

  jaeger:
    image: 'jaegertracing/all-in-one:1.57.0'
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      COLLECTOR_ZIPKIN_HOST_PORT: ':9411'
    ports:
      - '16686:16686'
      - '4318:4318'
      - '9411:9411'

volumes:
  mongodb-data:
